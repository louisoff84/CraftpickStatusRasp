<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Craftpick Status Admin</title><link rel="stylesheet" href="/admin.css"></head><body><section id="login" class="box"><b>CRAFTPICK STATUS</b><h1>Administration</h1><input id="password" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><small id="error"></small></section><main id="panel" hidden><header><div><b>CRAFTPICK STATUS</b><h1>Administration</h1></div><button onclick="logout()">Déconnexion</button></header><div class="grid"><section class="box"><h2>Monitor</h2><input id="name" placeholder="Nom"><input id="url" placeholder="https://craftpick.fr ou tcp://host:25565"><select id="type"><option value="http">HTTP / HTTPS</option><option value="tcp">TCP</option></select><input id="interval" type="number" min="10" value="30"><button onclick="saveMonitor()">Enregistrer</button></section><section class="box"><h2>Services</h2><div id="list"></div></section><section class="box"><h2>Paramètres</h2><input id="site" placeholder="Nom de la status page"><input id="webhook" placeholder="Discord webhook (optionnel)"><button onclick="saveSettings()">Sauvegarder</button><button onclick="check()">Vérifier maintenant</button></section></div></main><script src="/admin.js"></script></body></html>
